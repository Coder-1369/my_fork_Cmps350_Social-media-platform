<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUGeeks | Home</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/feed.css">
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/feed.js" defer></script>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2 class="sidebar-title">Technical Forum</h2>
            <span class="sidebar-subtitle">For All Geeks</span>
        </div>
        <nav class="sidebar-nav">
            <a href="feed.html" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Home
            </a>
            <a href="explore.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                Explore
            </a>
            <a href="profile.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                Profile
            </a>
            <a href="#" id="logout-btn" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Logout
            </a>
        </nav>
    </aside>

    <main class="feed-main">
        <header class="feed-topbar">
            <span class="topbar-logo">QUGeeks</span>
        </header>

        <section class="feed-content">
            <div class="feed-header">
                <h1 class="feed-title">Your <span class="highlight">Feed</span></h1>
                <p class="feed-description">See what the QU technical community is sharing.</p>
            </div>

            <div class="create-post-card">
                <div id="create-post-avatar" class="post-author-avatar"></div>
                <div class="create-post-body">
                    <textarea id="post-content" placeholder="Share something with the network…"></textarea>
                    <div class="create-post-footer">
                        <button id="submit-post-btn" class="btn-post">Post</button>
                    </div>
                </div>
            </div>

            <div id="posts-feed"></div>
        </section>
    </main>
</body>

</html>
